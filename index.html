<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Retorno do Hub</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; max-width: 560px; margin: 12vh auto; padding: 0 16px; }
  h1 { font-size: 22px; }
  code { display: block; word-break: break-all; padding: 12px; border-radius: 8px; background: rgba(127,127,127,.15); }
  button { font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 9px; border: 0; background: #2457d6; color: #fff; margin-top: 12px; }
  .mut { opacity: .7; font-size: 14px; }
</style>
</head>
<body>
<h1 id="titulo">Voltando para o seu hub…</h1>
<p id="texto" class="mut">Se nada acontecer em alguns segundos, o painel do hub não está aberto neste Mac.</p>
<div id="manual" hidden>
  <p>Abra o painel (<b>bash mac/painel.sh</b> no Terminal) e cole este endereço no campo
     <b>“A página de retorno deu erro? Cole a URL aqui”</b>:</p>
  <code id="url"></code>
  <button id="copiar">Copiar endereço</button>
</div>
<script>
  // Esta página só repassa o código de autorização para o hub rodando no seu Mac.
  // Ela não guarda nem envia nada para nenhum outro lugar.
  var HUB = "http://localhost:8000";
  var MARKETPLACE = "mercadolivre";
  var query = location.search;
  var urlEl = document.getElementById("url");
  urlEl.textContent = location.href;
  document.getElementById("copiar").onclick = function () {
    navigator.clipboard.writeText(location.href).then(function () {
      document.getElementById("copiar").textContent = "Copiado!";
    });
  };
  if (query.indexOf("code=") === -1 && query.indexOf("error=") === -1) {
    document.getElementById("titulo").textContent = "Página de retorno do Hub";
    document.getElementById("texto").textContent = "Tudo certo: este é o endereço de retorno do seu hub. Ele é usado automaticamente quando você conecta uma conta.";
  } else {
    setTimeout(function () { document.getElementById("manual").hidden = false; }, 4000);
    location.replace(HUB + "/oauth/" + MARKETPLACE + "/callback" + query);
  }
</script>
</body>
</html>
